<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f6f7;color:#1f2328}
header{background:#d7262e;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
#estado{font-size:13px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px}
#estado.ok{background:#fff;color:#d7262e;font-weight:700}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h2{margin:0 0 6px;font-size:16px;color:#d7262e}
.card p{margin:0 0 10px;font-size:13px;color:#666}
label{font-size:13px;font-weight:600;display:block;margin:10px 0 4px}
input{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
button{background:#d7262e;color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px}
button:active{opacity:.8}
#chat{display:none}
#msgs{height:55vh;min-height:300px;overflow-y:auto;background:#fafafa;border-radius:10px;padding:10px;margin-bottom:10px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;margin:6px 0;font-size:14px;word-wrap:break-word;white-space:pre-wrap}
.m small{display:block;font-size:10px;opacity:.7;margin-top:2px}
.yo{background:#d7262e;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.otro{background:#fff;border:1px solid #e3e3e3;border-bottom-left-radius:4px}
.sys{text-align:center;font-size:12px;color:#888;margin:8px 0}
.row{display:flex;gap:8px}
.row button{margin:0}
</style>
</head>
<body>
<header><h1>Sales Tracker</h1><span id="estado">Sin conectar</span></header>
<main>
  <div id="login" class="card">
    <h2>Entrar a una sala</h2>
    <p>Ambos escriben el mismo nombre de sala y la misma clave. El historial se guarda.</p>
    <label>Tu nombre</label><input id="nombre" maxlength="20" placeholder="Ej: Eddie">
    <label>Sala</label><input id="sala" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="Ej: casa">
    <label>Clave</label><input id="clave" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="Una clave que solo ustedes sepan">
    <button id="btnEntrar">Entrar</button>
  </div>

  <div id="chat" class="card">
    <h2 id="titulo">Sala</h2>
    <div id="msgs"></div>
    <div class="row">
      <input id="txt" placeholder="Escribe un mensaje..." autocomplete="off">
      <button id="btnEnviar">Enviar</button>
    </div>
  </div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,addDoc,query,orderBy,limitToLast,onSnapshot,serverTimestamp}
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyA2XMxAIDvF0JxZfbwJpHwBXdhMzSSGbeA",
  authDomain:"global-chat-69dfc.firebaseapp.com",
  projectId:"global-chat-69dfc",
  storageBucket:"global-chat-69dfc.firebasestorage.app",
  messagingSenderId:"780854182376",
  appId:"1:780854182376:web:821b0b4efa22b71afba45d"
};

const db=getFirestore(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
const yoId=Math.random().toString(36).slice(2);
let col,key,nombre;
const vistos=new Set();

const b64=u=>btoa(String.fromCharCode(...u));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');

async function derivar(sala,clave){
  const te=new TextEncoder();
  const h=await crypto.subtle.digest('SHA-256',te.encode('topic|'+sala+'|'+clave));
  const id=hex(h).slice(0,40);
  const base=await crypto.subtle.importKey('raw',te.encode(clave),'PBKDF2',false,['deriveKey']);
  key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:te.encode('sala|'+sala),iterations:100000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  return id;
}
async function cifrar(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);
  return b64(out);
}
async function descifrar(s){
  const raw=unb64(s);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function entrar(){
  nombre=$('nombre').value.trim()||'Anónimo';
  const sala=$('sala').value.trim().toLowerCase(),clave=$('clave').value.trim().toLowerCase();
  if(!sala||!clave){alert('Escribe sala y clave');return}
  try{localStorage.setItem('chat_nombre',nombre);localStorage.setItem('chat_sala',sala)}catch(e){}
  const id=await derivar(sala,clave);
  $('login').style.display='none';$('chat').style.display='block';
  $('titulo').textContent='Sala: '+sala+'  ·  ID '+id.slice(4,10).toUpperCase();
  col=collection(db,'salas',id,'mensajes');
  escuchar();
}

function escuchar(){
  const q=query(col,orderBy('ts'),limitToLast(300));
  onSnapshot(q,async snap=>{
    $('estado').textContent='Conectado';$('estado').className='ok';
    for(const ch of snap.docChanges()){
      if(ch.type!=='added'||vistos.has(ch.doc.id))continue;
      vistos.add(ch.doc.id);
      try{
        const m=await descifrar(ch.doc.data().c);
        burbuja(m.n,m.t,m.id===yoId?'yo':'otro',m.ts);
      }catch(e){/* mensaje con otra clave: se ignora */}
    }
  },err=>{
    $('estado').textContent='Error';$('estado').className='';
    sys('Error: '+err.code+' — revisa las reglas de Firestore');
  });
}

async function enviar(){
  const t=$('txt').value.trim();
  if(!t)return;
  $('txt').value='';
  try{
    const c=await cifrar({id:yoId,n:nombre,t,ts:Date.now()});
    await addDoc(col,{c,ts:serverTimestamp()});
  }catch(e){sys('No se pudo enviar: '+(e.code||e.message))}
}

function burbuja(n,t,cls,ts){
  const d=document.createElement('div');d.className='m '+cls;
  d.textContent=t;
  const s=document.createElement('small');
  s.textContent=n+' · '+new Date(ts).toLocaleString([],{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  d.appendChild(s);
  $('msgs').appendChild(d);$('msgs').scrollTop=1e9;
}
function sys(t){const d=document.createElement('div');d.className='sys';d.textContent=t;$('msgs').appendChild(d)}

$('btnEntrar').onclick=entrar;
$('btnEnviar').onclick=enviar;
$('txt').onkeydown=e=>{if(e.key==='Enter')enviar()};
try{$('nombre').value=localStorage.getItem('chat_nombre')||'';$('sala').value=localStorage.getItem('chat_sala')||''}catch(e){}
</script>
</body>
</html>
